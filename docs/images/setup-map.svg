<g font-family="system-ui,Segoe UI,sans-serif">
<text x="42" y="48" fill="#8acbbf" font-size="15" letter-spacing="3">MAKE YOURSELF AT HOME</text>
<path d="M330 161h35m-10-8 10 8-10 8m310-8h35m-10-8 10 8-10 8m310-8h35m-10-8 10 8-10 8" stroke="#8acbbf" fill="none" stroke-width="2"/>
