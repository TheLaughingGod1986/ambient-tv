<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="310" viewBox="0 0 1440 310" role="img" aria-labelledby="title desc">
<title id="title">Four small steps to your new Home</title><desc id="desc">Build the app, try demo scenery, connect your own services, and choose Home or screensaver.</desc>
