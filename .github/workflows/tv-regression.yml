name: TV navigation regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_AVD_HOME: /tmp/ambient-avd
      ANDROID_USER_HOME: /tmp/ambient-android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install emulator image
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libpulse0 libxkbcommon-x11-0 libxcb-cursor0
          sudo chmod a+rw /dev/kvm
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'emulator' 'system-images;android-35;google_apis;x86_64'
      - name: Boot emulator
        timeout-minutes: 7
        run: |
          trap 'cat /tmp/emulator.log 2>/dev/null || true' ERR
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          echo no | avdmanager create avd --name tv-test --path "$ANDROID_AVD_HOME/tv-test.avd" --package 'system-images;android-35;google_apis;x86_64'
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-35\n' "$ANDROID_AVD_HOME/tv-test.avd" > "$ANDROID_AVD_HOME/tv-test.ini"
          "$ANDROID_HOME/emulator/emulator" -avd tv-test -no-window -no-audio -no-snapshot -no-boot-anim -no-metrics -memory 2048 -cores 2 -gpu swiftshader_indirect -feature -Vulkan > /tmp/emulator.log 2>&1 &
          timeout 120 adb wait-for-device
          timeout 300 bash -c 'until adb shell getprop sys.boot_completed | grep -q 1; do sleep 2; done'
          adb shell input keyevent 82
      - name: Build and exercise both TV resolutions
        run: |
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
          scripts/test-tv.sh emulator-5554
